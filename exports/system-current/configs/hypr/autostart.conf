# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Hide the VT cursor so it doesn't bleed through when DPMS turns off the screen
exec-once = sleep 1 && printf '\033[?25l' > /dev/$(cat /sys/class/tty/tty0/active)

# Aula F75 keyboard wheel -> volume control
exec-once = sleep 3 && ~/.local/bin/aula-f75-wheel-volume

# Waybar crash recovery watchdog (bug no battery udev thread do waybar 0.15.0)
exec-once = bash -c 'while sleep 15; do pgrep -x waybar > /dev/null || { sleep 5; pgrep -x waybar > /dev/null || omarchy-restart-waybar; }; done'
