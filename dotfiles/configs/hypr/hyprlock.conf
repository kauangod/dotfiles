source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 4
    blur_size = 6
}

animations {
    enabled = false
}

# Saudação centralizada
label {
    monitor =
    text = Olá, Kauan
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, 80
    halign = center
    valign = center
}

# Campo de senha menor e fino, centralizado
input-field {
    monitor =
    size = 300, 45
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color
    font_size = 14

    placeholder_text = <span>  </span>
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 8
    shadow_passes = 0
    fade_on_empty = false
    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.3
}

# Relógio centralizado no topo
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, -80
    halign = center
    valign = top
}

# Data centralizada abaixo do relógio
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, -145
    halign = center
    valign = top
}

# Última atividade centralizada no bottom
label {
    monitor =
    text = cmd[] hyprctl activewindow -j | jq -r '"  " + .class + ": " + .title' | head -c 80
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, 40
    halign = center
    valign = bottom
}

auth {
    fingerprint:enabled = true
}
